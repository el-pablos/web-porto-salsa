name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  release:
    name: Create Release & Tag
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get commit message
        id: commit
        run: echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          echo "## Changelog" > CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          # Get commits since last tag (or last 20 if no tags)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --oneline -20 --pretty=format:"- %s (%h)" >> CHANGELOG_BODY.md
          else
            git log ${LAST_TAG}..HEAD --oneline --pretty=format:"- %s (%h)" >> CHANGELOG_BODY.md
          fi
          echo "" >> CHANGELOG_BODY.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_BODY.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if version tag exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create versioned tag with SHA suffix (always unique per commit)
          TAG="v${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}"
          git tag -a "$TAG" -m "Release $TAG - ${{ steps.commit.outputs.message }}"
          git push origin "$TAG"

          # Create or update base version tag (e.g., v3.0.0)
          BASE_TAG="v${{ steps.version.outputs.version }}"
          git tag -fa "$BASE_TAG" -m "Release $BASE_TAG" 2>/dev/null || true
          git push origin "$BASE_TAG" --force 2>/dev/null || true

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🌸 Latest Release — v${{ steps.version.outputs.version }}"
          body: |
            ## Portfolio Adinda Salsa Aryadi Putri

            ![Version](https://img.shields.io/badge/version-v${{ steps.version.outputs.version }}-pink?style=for-the-badge)
            ![Build](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/main.yml?branch=main&style=for-the-badge&label=build)
            ![Release](https://img.shields.io/github/v/release/${{ github.repository }}?style=for-the-badge&color=hotpink)

            **Version:** `v${{ steps.version.outputs.version }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Last change:** ${{ steps.commit.outputs.message }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ---

            ${{ steps.changelog.outputs.changelog }}

            ---

            ### Tech Stack
            - Next.js 14 + TypeScript
            - Tailwind CSS + Framer Motion
            - Pink pastel theme dengan interactive animations

            ### Live
            🔗 [salsa.tams.codes](https://salsa.tams.codes)

            ---
            _Auto-generated by CI/CD pipeline_
          draft: false
          prerelease: false
          make_latest: true

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}"
          name: "v${{ steps.version.outputs.version }} — ${{ steps.commit.outputs.message }}"
          body: |
            ## Release v${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}

            **Commit:** `${{ github.sha }}`
            **Message:** ${{ steps.commit.outputs.message }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ---

            ${{ steps.changelog.outputs.changelog }}

            ---

            See [full changelog](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          draft: false
          prerelease: false
          generate_release_notes: true
